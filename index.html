<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maestro Jamonero Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{jamon:{50:'#fcf8f5',100:'#f7ede4',200:'#edd8c7',700:'#8a2b38',800:'#621722',900:'#420d14',950:'#260508'},gold:{400:'#dfc27d',500:'#c5a059',600:'#a3813c'}},fontFamily:{sans:['Plus Jakarta Sans','sans-serif']}}}}</script>
</head>
<body class="bg-jamon-50 text-slate-800 font-sans min-h-screen pb-24">
<header class="bg-jamon-900 text-white sticky top-0 z-50 border-b border-gold-500/20 shadow-xl">
 <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
  <div class="flex items-center space-x-3">
   <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-gold-400 to-gold-600 flex items-center justify-center text-jamon-950 text-xl"><i class="fa-solid fa-utensils"></i></div>
   <div><h1 class="font-extrabold text-base sm:text-lg tracking-wider text-gold-400">MAESTRO JAMONERO</h1><p class="text-[11px] text-jamon-200 uppercase tracking-widest">Control &amp; Gestión Pro</p></div>
  </div>
  <button onclick="sync(true)" class="bg-gold-500/20 hover:bg-gold-500/30 text-gold-400 border border-gold-500/40 px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-2"><i class="fa-solid fa-rotate" id="syncIcon"></i><span class="hidden sm:inline">Sincronizar</span></button>
 </div>
</header>
<nav class="bg-jamon-800 sticky top-[67px] z-40 border-b border-jamon-700"><div class="max-w-7xl mx-auto px-2 flex overflow-x-auto space-x-1.5 py-2.5" id="tabs"></div></nav>
<main class="max-w-7xl mx-auto px-4 py-6" id="main"></main>

<div id="modal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
 <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full max-h-[90vh] flex flex-col overflow-hidden">
  <div class="bg-jamon-900 px-6 py-4 flex justify-between items-center"><h3 id="mtitle" class="font-extrabold text-gold-400"></h3><button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/10 text-white text-lg">&times;</button></div>
  <div class="p-6 overflow-y-auto space-y-4" id="mbody"></div>
 </div>
</div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyWturf5n7Pjnrm9R1Sa3BiEo83I-A0ID1CuLXIVZ91tRsJxwzL_t1ckTxFW8-v4U6B/exec";
const NEGOCIO="Maestro Jamonero", TEL_PAIS="34", IVA=0.21;
const DEF_TARIFAS=[
 {"ID Concepto":"TAR-01","Categoria":"Corte Base","Descripción":"Jamón (corte completo loncheado)","Precio Base (€)":45,"Unidad":"Pieza"},
 {"ID Concepto":"TAR-02","Categoria":"Corte Base","Descripción":"Paleta (corte completo loncheado)","Precio Base (€)":35,"Unidad":"Pieza"},
 {"ID Concepto":"TAR-03","Categoria":"Suplementos","Descripción":"Pieza muy jugosa / blanda","Precio Base (€)":8,"Unidad":"Pieza"},
 {"ID Concepto":"TAR-04","Categoria":"Suplementos","Descripción":"Pieza muy seca / dura","Precio Base (€)":10,"Unidad":"Pieza"},
 {"ID Concepto":"TAR-05","Categoria":"Extras","Descripción":"Corte de huesos para caldo","Precio Base (€)":5,"Unidad":"Pieza"}];
const T="Precios y Tarifas",C="Clientes",P="Inventario y Piezas",O="Pedidos y Servicios";
const ID={[C]:"ID Cliente",[P]:"ID Pieza",[O]:"ID Pedido"};
let db={[C]:[],[P]:[],[O]:[],[T]:DEF_TARIFAS}, tab="dashboard";
const TABS=[["dashboard","chart-pie","Panel"],["pedidos","clipboard-list","Pedidos"],["piezas","drumstick-bite","Inventario"],["clientes","users","Clientes"],["tarifas","tags","Tarifas"],["cotizador","calculator","Cotizador Pro"]];

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v??"").replace(",","."));return isNaN(n)?0:n};
const eur=n=>n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const newId=p=>p+"-"+Date.now().toString(36).toUpperCase().slice(-5);
const today=()=>new Date().toISOString().slice(0,10);
const IN="w-full border border-slate-300 rounded-xl p-3 text-sm bg-white focus:ring-2 focus:ring-jamon-700 outline-none";
const LB="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5";
const BTN="w-full bg-jamon-900 hover:bg-jamon-800 text-gold-400 py-3.5 rounded-xl font-bold shadow-lg transition";

/* ---------- Datos ---------- */
function load(){try{const s=JSON.parse(localStorage.getItem("jamones_db"));if(s)db=Object.assign(db,s)}catch(e){}}
function save(){try{localStorage.setItem("jamones_db",JSON.stringify(db))}catch(e){}}
async function sync(manual){
  const ic=$("syncIcon");ic.classList.add("fa-spin");
  try{
    const d=await (await fetch(SCRIPT_URL+"?action=getData")).json();
    const falta=[C,P,O,T].filter(k=>!Array.isArray(d[k]));
    for(const k of [C,P,O,T]) if(Array.isArray(d[k])&&(k!==T||d[k].length)) db[k]=d[k];
    save();render();
    if(falta.length) toast("Pestañas no encontradas en el Sheet: "+falta.join(", "),true);
    else toast("Sincronizado con Google Sheets");
  }catch(e){ if(manual) toast("Sin conexión: trabajando en modo local",true) }
  ic.classList.remove("fa-spin");
}
function push(payload){ // text/plain evita el preflight CORS de Apps Script
  fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}).catch(()=>toast("No se pudo enviar a Sheets",true));
}
function add(sheet,obj){(db[sheet]=db[sheet]||[]).push(obj);save();push({sheet,rowObj:obj});}
function del(sheet,i){
  if(!confirm("¿Seguro que deseas eliminar este registro?"))return;
  const [r]=db[sheet].splice(i,1);save();push({action:"delete",sheet,id:r[ID[sheet]]});render();toast("Registro eliminado");
}
function toast(m,err){
  const d=document.createElement("div");
  d.className="fixed bottom-5 right-5 bg-jamon-900 text-gold-400 px-5 py-3 rounded-2xl shadow-2xl z-[60] text-xs font-extrabold border "+(err?"border-red-400":"border-gold-500/30");
  d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3000);
}

/* ---------- Vistas ---------- */
function switchTab(t){tab=t;render()}
function head(title,sub,btn,modal){return `<div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-4"><div><h2 class="text-lg font-extrabold text-jamon-900">${title}</h2><p class="text-xs text-slate-500">${sub}</p></div>${btn?`<button onclick="openModal('${modal}')" class="bg-jamon-900 text-gold-400 px-4 py-2.5 rounded-xl text-xs font-bold"><i class="fa-solid fa-plus"></i> ${btn}</button>`:""}</div>`}
function table(cols,rows){return `<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-x-auto"><table class="w-full text-left text-sm"><thead class="bg-jamon-50 text-jamon-900 uppercase text-[11px] tracking-wider">${"<tr>"+cols.map(c=>`<th class="p-4">${c}</th>`).join("")+"</tr>"}</thead><tbody class="divide-y divide-slate-100">${rows||`<tr><td class="p-6 text-slate-400" colspan="9">Sin registros todavía</td></tr>`}</tbody></table></div>`}
const trash=(s,i)=>`<button onclick="del('${s}',${i})" class="w-8 h-8 rounded-lg bg-red-50 hover:bg-red-100 text-red-600"><i class="fa-solid fa-trash text-xs"></i></button>`;
const pill=(t,c)=>`<span class="px-2.5 py-1 rounded-full text-xs font-bold ${c}">${esc(t)}</span>`;

function render(){
  $("tabs").innerHTML=TABS.map(([id,ic,l])=>`<button onclick="switchTab('${id}')" class="px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap flex items-center space-x-2 ${id===tab?"bg-jamon-900 text-gold-400 border border-gold-500/30":"text-slate-200 hover:bg-jamon-700/60"}"><i class="fa-solid fa-${ic}"></i><span>${l}</span></button>`).join("");
  $("main").innerHTML=({dashboard:vDash,pedidos:vPed,piezas:vPz,clientes:vCli,tarifas:vTar,cotizador:vCot})[tab]();
  if(tab==="cotizador")calc();
}
function vDash(){
  const act=db[O].filter(o=>!["Entregado","Cobrado"].includes(o["Estado Pedido"]));
  const ing=db[O].reduce((a,o)=>a+num(o["Total A Cobrar (€)"]),0);
  const k=(l,v,c)=>`<div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200"><p class="text-xs font-bold text-slate-400 uppercase tracking-wider">${l}</p><h3 class="text-3xl font-extrabold ${c} mt-2">${v}</h3></div>`;
  const q=(t,m,ic)=>`<button onclick="tab='${t}';openModal('${m}')" class="p-4 bg-jamon-100/60 hover:bg-jamon-100 text-jamon-900 rounded-2xl border border-jamon-200 font-bold flex items-center justify-center space-x-3"><i class="fa-solid fa-${ic}"></i><span>${{pedido:"Nuevo Pedido",pieza:"Registrar Pieza",cliente:"Nuevo Cliente"}[m]}</span></button>`;
  return `<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${k("Pedidos activos",act.length,"text-jamon-900")}${k("Piezas en proceso",db[P].filter(p=>p["Estado Pieza"]!=="Entregado"&&p["Estado Pieza"]!=="Terminado").length,"text-amber-700")}${k("Clientes",db[C].length,"text-emerald-700")}${k("Ingresos estimados",eur(ing),"text-blue-800")}</div>
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mt-6"><h3 class="font-bold text-jamon-900 mb-4">Acciones rápidas</h3><div class="grid sm:grid-cols-3 gap-4">${q("pedidos","pedido","plus")}${q("piezas","pieza","drumstick-bite")}${q("clientes","cliente","user-plus")}</div></div>`;
}
function vPed(){return head("Gestión de Pedidos","Cola de trabajo y prioridades","Añadir Pedido","pedido")+table(["Pedido / Fecha","Cliente","Pieza","Prioridad","Estado","Total",""],db[O].map((o,i)=>`<tr><td class="p-4 font-bold text-jamon-900">${esc(o["ID Pedido"])}<br><span class="text-[11px] font-normal text-slate-400">${esc(String(o["Fecha Pedido"]).slice(0,10))}</span></td><td class="p-4">${esc(o["ID Cliente"])}</td><td class="p-4 text-slate-600">${esc(o["ID Pieza"])}</td><td class="p-4">${pill(o["Prioridad"]||"Normal",o["Prioridad"]==="Alta/Urgente"?"bg-red-100 text-red-700":"bg-slate-100 text-slate-600")}</td><td class="p-4">${pill(o["Estado Pedido"]||"Pendiente","bg-emerald-100 text-emerald-800")}</td><td class="p-4 font-extrabold text-jamon-900">${eur(num(o["Total A Cobrar (€)"]))}</td><td class="p-4 text-right">${trash(O,i)}</td></tr>`).join(""))}
function vPz(){return head("Inventario y Piezas","Control de pesos, curación y estado","Nueva Pieza","pieza")+`<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">${db[P].map((p,i)=>`<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-3"><div class="flex justify-between"><div><span class="text-[10px] font-black text-gold-600 uppercase">${esc(p["Tipo"])}</span><h3 class="font-extrabold text-jamon-900 text-lg">${esc(p["Marca/Origen"]||"Sin marca")}</h3></div>${pill(p["Estado Pieza"]||"En espera",p["Estado Pieza"]==="Terminado"?"bg-emerald-100 text-emerald-800":"bg-amber-100 text-amber-800")}</div><div class="text-xs space-y-1.5 bg-slate-50 p-3 rounded-xl"><p class="flex justify-between"><span>Propietario</span><b>${esc(p["Cliente Propietario"])}</b></p><p class="flex justify-between"><span>Peso entrada</span><b>${num(p["Peso Entrada (kg)"])} kg</b></p><p class="flex justify-between"><span>Sobres (salida)</span><b>${num(p["Peso Salida Sobres (kg)"])} kg</b></p><p class="flex justify-between"><span>Condición</span><b>${esc(p["Condición Pieza"]||"Normal")}</b></p></div><div class="pt-2 border-t flex justify-between items-center text-xs"><span class="text-slate-400">ID: ${esc(p["ID Pieza"])}</span>${trash(P,i)}</div></div>`).join("")||'<p class="text-slate-400">Sin piezas todavía</p>'}</div>`}
function vCli(){return head("Directorio de Clientes","Amigos, familiares y conocidos","Añadir Cliente","cliente")+table(["Nombre","Teléfono","Relación","Preferencias de corte",""],db[C].map((c,i)=>`<tr><td class="p-4 font-bold text-jamon-900">${esc(c["Nombre Completo"])}</td><td class="p-4"><a href="tel:${esc(c["Teléfono"])}" class="text-jamon-700 font-semibold underline">${esc(c["Teléfono"])}</a></td><td class="p-4">${pill(c["Relación/Contacto"]||"-","bg-slate-100 text-slate-700")}</td><td class="p-4 text-xs text-slate-600">${esc(c["Preferencias de Corte"]||"Ninguna")}</td><td class="p-4 text-right">${trash(C,i)}</td></tr>`).join(""))}
function vTar(){return head("Tarifas y Suplementos","Se editan en la hoja «Precios y Tarifas» de Google Sheets")+table(["Categoría","Descripción","Precio","Unidad"],db[T].map(t=>`<tr><td class="p-4">${pill(gk(t,"categ")||"-","bg-jamon-50 text-jamon-800 border border-jamon-200")}</td><td class="p-4 font-semibold">${esc(ds(t))}</td><td class="p-4 font-black text-jamon-900">${eur(pr(t))}</td><td class="p-4 text-xs text-slate-500">${esc(gk(t,"unidad"))}</td></tr>`).join(""))}

/* ---------- Cotizador ---------- */
const nk=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const gk=(t,w)=>{const k=Object.keys(t).find(k=>nk(k).includes(w));return k===undefined?"":t[k]};
const pr=t=>num(gk(t,"precio")), ds=t=>String(gk(t,"descrip")||gk(t,"concepto")||"Servicio");
const cat=c=>db[T].filter(t=>nk(gk(t,"categ")).startsWith(nk(c).slice(0,5)));
const optT=(arr,pre)=>arr.map(t=>`<option value="${pr(t)}" data-n="${esc(ds(t))}">${esc(ds(t))} (${pre}${eur(pr(t))})</option>`).join("");
function vCot(){
  return `<div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 sm:p-8 max-w-2xl mx-auto space-y-5">
  <div class="border-b pb-4"><h2 class="text-xl font-extrabold text-jamon-900">Cotizador Profesional</h2><p class="text-xs text-slate-500">Presupuesto por pieza o por kilo, con suplementos, extras y descuento</p></div>
  <div class="grid sm:grid-cols-2 gap-4">
   <div><label class="${LB}">Cliente</label><select id="q-cli" class="${IN}" onchange="calc()"><option value="">— Sin cliente —</option>${db[C].map((c,i)=>`<option value="${i}">${esc(c["Nombre Completo"])}</option>`).join("")}</select></div>
   <div><label class="${LB}">Estrategia de cobro</label><select id="q-modo" class="${IN}" onchange="calc()"><option value="pieza">Precio fijo por pieza</option><option value="kilo">Por kilo (€/kg × peso)</option></select></div>
  </div>
  <div class="grid sm:grid-cols-2 gap-4">
   <div id="q-base-wrap"></div>
   <div><label class="${LB}">Peso de la pieza (kg)</label><input type="number" id="q-kg" value="7.5" step="0.1" min="0" class="${IN} font-bold" oninput="calc()"></div>
  </div>
  <div><label class="${LB}">Condición de la pieza</label><select id="q-sup" class="${IN}" onchange="calc()"><option value="0" data-n="">En perfecto estado (sin suplemento)</option>${optT(cat("Suplementos"),"+")}</select></div>
  <div><label class="${LB}">Servicios extra</label><div class="grid sm:grid-cols-2 gap-2">${cat("Extras").concat(cat("Otros")).map(t=>`<label class="flex items-center space-x-3 text-xs font-semibold bg-slate-50 p-3 rounded-xl border cursor-pointer"><input type="checkbox" class="q-ext" value="${pr(t)}" data-n="${esc(ds(t))}" onchange="calc()"><span>${esc(ds(t))} <b class="text-jamon-900">(+${eur(pr(t))})</b></span></label>`).join("")||'<p class="text-xs text-slate-400">Sin extras definidos</p>'}</div></div>
  <div class="grid sm:grid-cols-2 gap-4">
   <div><label class="${LB}">Descuento (€)</label><input type="number" id="q-dto" value="0" min="0" step="0.5" class="${IN}" oninput="calc()"></div>
   <label class="flex items-center space-x-3 text-sm font-semibold mt-6"><input type="checkbox" id="q-iva" onchange="calc()" class="w-4 h-4"><span>Añadir IVA (${IVA*100}%)</span></label>
  </div>
  <div class="bg-gradient-to-br from-jamon-900 to-jamon-950 text-white p-6 rounded-2xl space-y-4 border border-gold-500/30">
   <div class="text-xs text-jamon-100 space-y-1.5 border-b border-white/10 pb-4" id="q-des"></div>
   <div><p class="text-[11px] text-gold-400 font-extrabold uppercase tracking-widest">Total presupuestado</p><h3 class="text-4xl font-black" id="q-tot">0,00 €</h3></div>
   <div class="grid sm:grid-cols-2 gap-3"><button onclick="whatsapp()" class="bg-emerald-600 hover:bg-emerald-500 py-3.5 rounded-xl text-sm font-bold flex items-center justify-center space-x-2"><i class="fa-brands fa-whatsapp text-lg"></i><span>Enviar por WhatsApp</span></button><button onclick="copiar()" class="bg-white/10 hover:bg-white/20 py-3.5 rounded-xl text-sm font-bold"><i class="fa-regular fa-copy"></i> Copiar mensaje</button></div>
  </div></div>`;
}
let Q={};
function calc(){
  const modo=$("q-modo").value, wrap=$("q-base-wrap");
  const kmode=modo==="kilo", had=$("q-base");
  if(!had||had.dataset.m!==modo){
    wrap.innerHTML=kmode?`<label class="${LB}">Precio por kilo (€/kg)</label><input type="number" id="q-base" data-m="kilo" value="6" step="0.1" min="0" class="${IN} font-bold" oninput="calc()">`
      :`<label class="${LB}">Servicio base</label><select id="q-base" data-m="pieza" class="${IN}" onchange="calc()">${optT(cat("Corte Base"),"")||'<option value="0" data-n="Servicio">⚠ Sin tarifas «Corte Base» en el Sheet</option>'}</select>`;
  }
  const b=$("q-base"), kg=num($("q-kg").value), pb=num(b.value);
  const base=kmode?pb*kg:pb, bn=kmode?"Loncheado profesional":(b.selectedOptions[0]?.dataset.n||"Servicio base");
  const sel=$("q-sup").selectedOptions[0], sup=num($("q-sup").value), sn=sel?.dataset.n||"";
  const ext=[...document.querySelectorAll(".q-ext:checked")].map(c=>({n:c.dataset.n,v:num(c.value)}));
  const dto=Math.min(num($("q-dto").value),base+sup+ext.reduce((a,e)=>a+e.v,0));
  const sub=base+sup+ext.reduce((a,e)=>a+e.v,0)-dto, iva=$("q-iva").checked?sub*IVA:0, tot=sub+iva;
  Q={kmode,kg,pb,base,bn,sn,sup,ext,dto,sub,iva,tot};
  const ln=(a,b,s)=>`<div class="flex justify-between"><span>${a}</span><b>${s||""}${b}</b></div>`;
  $("q-des").innerHTML=ln(kmode?`${esc(bn)} · ${kg} kg × ${eur(pb)}/kg`:esc(bn),eur(base))+(sup?ln(esc(sn),eur(sup),"+"):"")+ext.map(e=>ln(esc(e.n),eur(e.v),"+")).join("")+(dto?ln("Descuento",eur(dto),"−"):"")+(iva?ln(`IVA ${IVA*100}%`,eur(iva),"+"):"");
  $("q-tot").textContent=eur(tot);
}
function mensaje(){
  const i=$("q-cli").value, c=i!==""?db[C][i]:null, f=new Date().toLocaleDateString("es-ES",{day:"2-digit",month:"long",year:"numeric"});
  const L=[`*${NEGOCIO.toUpperCase()}* · Presupuesto`,`${f}`,"",c?`Estimado/a ${c["Nombre Completo"]}:`:"Buenos días:","","Le detallo el presupuesto para el corte de su pieza:","",
   `• *Servicio:* ${Q.kmode?`Loncheado a cuchillo (${eur(Q.pb)}/kg)`:Q.bn}`,`• *Peso de la pieza:* ${Q.kg.toLocaleString("es-ES")} kg`];
  if(Q.sup)L.push(`• *Condición de la pieza:* ${Q.sn} (+${eur(Q.sup)})`);
  Q.ext.forEach(e=>L.push(`• *Extra:* ${e.n} (+${eur(e.v)})`));
  if(Q.dto)L.push(`• *Descuento:* −${eur(Q.dto)}`);
  if(Q.iva)L.push(`• *IVA ${IVA*100}%:* ${eur(Q.iva)}`);
  L.push("",`*TOTAL: ${eur(Q.tot)}*${Q.iva?" (IVA incluido)":""}`,"","El servicio incluye loncheado profesional a cuchillo, envasado al vacío en sobres individuales y entrega de los huesos.","","¿Le parece bien para proceder? Quedo a su disposición para cualquier consulta.","Un cordial saludo.");
  return L.join("\n");
}
function whatsapp(){
  const i=$("q-cli").value; let tel=i!==""?String(db[C][i]["Teléfono"]).replace(/\D/g,""):"";
  if(tel.length===9)tel=TEL_PAIS+tel;
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(mensaje())}`,"_blank");
}
function copiar(){navigator.clipboard.writeText(mensaje()).then(()=>toast("Mensaje copiado"),()=>toast("No se pudo copiar",true))}

/* ---------- Formularios ---------- */
const fld=(l,h)=>`<div><label class="${LB}">${l}</label>${h}</div>`;
const opts=a=>a.map(x=>`<option>${esc(x)}</option>`).join("");
function openModal(t){
  const m=$("modal");m.classList.remove("hidden");m.classList.add("flex");
  const cl=opts(db[C].map(c=>c["Nombre Completo"]));
  const F={
   cliente:["Nuevo cliente",`<form onsubmit="gCli(event)" class="space-y-4">${fld("Nombre completo",`<input id="f1" required class="${IN}">`)}${fld("Teléfono",`<input id="f2" type="tel" required class="${IN}">`)}${fld("Relación",`<select id="f3" class="${IN}">${opts(["Amigo","Familiar","Conocido"])}</select>`)}${fld("Dirección / zona",`<input id="f4" class="${IN}">`)}${fld("Preferencias de corte",`<input id="f5" placeholder="Ej: sobres 100 g, loncha fina" class="${IN}">`)}<button class="${BTN}">Guardar cliente</button></form>`],
   pieza:["Nueva pieza",`<form onsubmit="gPz(event)" class="space-y-4">${fld("Propietario",`<select id="f1" class="${IN}">${cl||"<option>Sin clientes</option>"}</select>`)}<div class="grid grid-cols-2 gap-4">${fld("Tipo",`<select id="f2" class="${IN}">${opts(["Jamón","Paleta"])}</select>`)}${fld("Marca / origen",`<input id="f3" required class="${IN}">`)}</div><div class="grid grid-cols-2 gap-4">${fld("Peso entrada (kg)",`<input id="f4" type="number" step="0.1" value="7.5" required class="${IN}">`)}${fld("Condición",`<select id="f5" class="${IN}">${opts(["Normal","Muy jugosa / blanda","Muy seca / dura","Con moho / desperfecto"])}</select>`)}</div><button class="${BTN}">Guardar pieza</button></form>`],
   pedido:["Nuevo pedido",`<form onsubmit="gPed(event)" class="space-y-4">${fld("Cliente",`<select id="f1" class="${IN}">${cl||"<option>Sin clientes</option>"}</select>`)}${fld("Pieza asociada",`<select id="f2" class="${IN}">${db[P].map(p=>`<option value="${esc(p["ID Pieza"])}">${esc(p["Tipo"])} - ${esc(p["Marca/Origen"])} (${esc(p["Cliente Propietario"])})</option>`).join("")||"<option>Sin piezas</option>"}</select>`)}<div class="grid grid-cols-2 gap-4">${fld("Prioridad",`<select id="f3" class="${IN}">${opts(["Normal","Alta/Urgente"])}</select>`)}${fld("Total (€)",`<input id="f4" type="number" step="0.1" value="45" required class="${IN}">`)}</div><button class="${BTN}">Crear pedido</button></form>`]}[t];
  $("mtitle").textContent=F[0];$("mbody").innerHTML=F[1];
}
function closeModal(){const m=$("modal");m.classList.add("hidden");m.classList.remove("flex")}
const v=i=>$("f"+i).value.trim();
function fin(msg){closeModal();render();toast(msg)}
function gCli(e){e.preventDefault();add(C,{"ID Cliente":newId("CLI"),"Nombre Completo":v(1),"Teléfono":v(2),"Relación/Contacto":v(3),"Dirección / Zona":v(4),"Preferencias de Corte":v(5),"Confirmación Requisitos":"Sí","Notas":""});fin("Cliente guardado")}
function gPz(e){e.preventDefault();add(P,{"ID Pieza":newId("PZ"),"Cliente Propietario":v(1),"Tipo":v(2),"Marca/Origen":v(3),"Peso Entrada (kg)":num(v(4)),"Peso Salida Sobres (kg)":0,"Estado Pieza":"En espera","Condición Pieza":v(5),"Fecha Recepción":today(),"Notas/Observaciones":"Registrado desde la app"});fin("Pieza registrada")}
function gPed(e){e.preventDefault();const t=num(v(4));add(O,{"ID Pedido":newId("PED"),"ID Cliente":v(1),"ID Pieza":v(2),"Fecha Pedido":today(),"Prioridad":v(3),"Estado Pedido":"Pendiente","Precio Servicio Base (€)":t,"Suplementos Aplicados (€)":0,"Descuento (€)":0,"Total A Cobrar (€)":t,"Estado Pago":"Pendiente","Confirmación Cliente":"Confirmado","Observaciones":""});fin("Pedido creado")}

window.onload=()=>{load();render();sync(false)};
</script></body></html>
